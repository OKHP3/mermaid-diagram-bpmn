# Dependabot configuration for BPMN for Mermaid
# BPMN for Mermaid is a personal OverKill Hill P³ project by Jamie Hill.
#
# Update policy:
# - Daily npm updates are coordinated by coordinated-dependency-updates.yml.
# - Dependabot owns GitHub Actions updates only.
# - The deployment workflow validates the production build on pushes to main.
# - All PRs require human review and merge.
# - Mermaid major version upgrades require manual review of the plugin contract
#   in app/src/lib/bpmn-plugin.ts and docs/mermaid-compatibility.md before merging.
# - See docs/technology-inventory.md for runtimes, fixtures, and overrides that
#   need a coordinated maintenance PR outside Dependabot's coverage.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
