name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, test, and brand / generated-data checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run test

      - name: Skill tests
        run: pnpm run skill:test

      - name: Check generated data files are up to date (fix locally with 'pnpm run regen:generated')
        run: pnpm run check:generated

      - name: Test check:generated drift detection (exits 1 on injected mismatch)
        run: pnpm run check:generated:test

      - name: Validate skill frontmatter (fix with 'pnpm run skill:validate')
        run: pnpm run skill:validate

      - name: Test skill:validate failure-mode detection (exits 1 on bad frontmatter)
        run: pnpm run skill:validate:test

      - name: Check Forge brand tokens match profile (no drift)
        run: pnpm run brand:check

      - name: Test brand:check drift detection (exits 1 on injected mismatch)
        run: pnpm run brand:check:test

      - name: Build plugin package
        run: pnpm --filter @okhp3/mermaid-diagram-bpmn run build

      - name: Plugin pack dry-run (verify published file list)
        run: pnpm --filter @okhp3/mermaid-diagram-bpmn run pack:dry-run

      - name: Plugin smoke test (clean-install fixture)
        run: node scripts/run-plugin-smoke.mjs
