name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, test, and brand / generated-data checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build app (produces the manifest for the bundle-size gate)
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run build

      - name: Check initial JavaScript bundle size
        run: pnpm run check:bundle-size

      - name: Test bundle-size failure detection (exits 1 on oversized chunk)
        run: pnpm run check:bundle-size:test

      - name: Unit tests
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run test

      - name: Skill tests
        run: pnpm run skill:test

      - name: Check generated data files are up to date (fix locally with 'pnpm run regen:generated')
        run: pnpm run check:generated

      - name: Test check:generated drift detection (exits 1 on injected mismatch)
        run: pnpm run check:generated:test

      - name: Validate skill frontmatter (fix with 'pnpm run skill:validate')
        run: pnpm run skill:validate

      - name: Test skill:validate failure-mode detection (exits 1 on bad frontmatter)
        run: pnpm run skill:validate:test

      - name: Check Forge brand tokens match profile (no drift)
        run: pnpm run brand:check

      - name: Test brand:check drift detection (exits 1 on injected mismatch)
        run: pnpm run brand:check:test

      - name: Build plugin package
        run: pnpm --filter @okhp3/mermaid-diagram-bpmn run build

      - name: Plugin pack dry-run (verify published file list)
        run: pnpm --filter @okhp3/mermaid-diagram-bpmn run pack:dry-run

      - name: Plugin smoke test (clean-install fixture)
        run: node scripts/run-plugin-smoke.mjs

      - name: Content-drift check (test count, Mermaid version, plugin version citations)
        run: pnpm run check:content

      - name: Test content-drift detection (exits 1 on injected stale claim)
        run: pnpm run check:content:test

      - name: Check Mermaid DFKI #7699 source drift
        run: pnpm run check:dfki-7699

      - name: Release manifest check (version + compat range must match canonical sources)
        run: pnpm run manifest:check

  e2e:
    name: Real-browser E2E — Mermaid host demo (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright ${{ matrix.browser }} browser
        # Install each engine with its runtime libraries. The matrix exposes
        # browser-specific SVG/DOMPurify differences as separate CI jobs.
        run: pnpm --filter @workspace/mermaid-diagram-bpmn exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build app (required before vite preview)
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run build

      - name: Run host-demo and Playground E2E suite in ${{ matrix.browser }}
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run test:e2e --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: app/playwright-report/
          retention-days: 14

  visual-regression:
    name: Visual regression — mobile layout and snapshot checks
    needs: checks
    runs-on: ubuntu-latest
    # Write access is needed so the job can commit updated snapshot baselines
    # back to the repo on main-branch pushes.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use the GITHUB_TOKEN with write permission so git push works.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser
        # Visual checks need Chromium's native shared libraries just as much as
        # the cross-browser E2E matrix. `--with-deps` keeps fresh runners from
        # failing before the focus-ring and screenshot assertions can run.
        run: pnpm --filter @workspace/mermaid-diagram-bpmn exec playwright install --with-deps chromium

      - name: Build app (required before vite preview)
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run build

      # ── Main branch: regenerate baselines and commit if changed ─────────────
      # Always updating baselines on main ensures they reflect the current UI.
      # PRs then compare against these committed baselines.
      # The [skip ci] commit message token prevents an infinite trigger loop.
      - name: Update visual baselines (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run test:e2e:update-snapshots

      - name: Commit updated baselines (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/e2e/__snapshots__/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(snapshots): update visual regression baselines [skip ci]"
            git push
          else
            echo "Visual baselines unchanged — nothing to commit."
          fi

      # ── Pull requests: compare against committed baselines ──────────────────
      # Fails if any screenshot differs by more than the threshold defined in
      # the spec (maxDiffPixelRatio: 0.02 / 0.03).
      - name: Compare visual snapshots (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run test:e2e:visual

      - name: Upload visual regression report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            app/playwright-report/
            app/e2e/__snapshots__/
          retention-days: 14
