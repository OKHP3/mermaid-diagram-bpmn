name: Coordinated dependency updates

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinated-dependency-updates
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: automation/coordinated-dependency-updates
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Continue the single candidate without rewriting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch --create "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git switch --create "$BRANCH" origin/main
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Select mature stable vendor pins, including future Mermaid majors
        run: |
          node --test scripts/update-vendor-pins.test.mjs scripts/sync-mermaid-target.test.mjs scripts/release-manifest-state.test.mjs
          node scripts/update-vendor-pins.mjs --write
          node scripts/sync-mermaid-target.mjs
          node scripts/generate-manifest.mjs
      # Install the newly selected package manager and LTS, not the old versions.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Regenerate workspace and isolated consumer lockfiles
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run plugin:smoke
          pnpm run vendor:check
      - name: Determine whether a candidate remains to be tested
        id: candidate
        run: |
          if git diff --quiet origin/main --; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh evidence for a changed candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run technology:check -- --output docs/technology-versions.md --json docs/technology-versions.json
      - name: Commit and push candidate, including retries of unchanged failures
        if: steps.candidate.outputs.changed == 'true'
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): coordinate exact stable vendor pins"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Dispatch and wait for complete CI on this exact candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$BRANCH"
          run_id=""
          for attempt in $(seq 1 36); do
            run_id="$(gh run list --repo "$REPOSITORY" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$sha\" and .createdAt >= \"$started\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id" || { echo "CI dispatch was not found for $sha"; exit 1; }
          gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
          echo "CANDIDATE_CI_URL=https://github.com/$REPOSITORY/actions/runs/$run_id" >> "$GITHUB_ENV"
      - name: Open a review PR only after successful CI
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/vendor-update-pr.md" <<EOF
          Updates exact supported stable dependency and runtime pins after the 24-hour maturity window. Mermaid's source target, peer contract, standalone fixture, CDN example, and lockfiles move together.

          Validation: $CANDIDATE_CI_URL (the exact candidate passed application, package, security, three-browser, and visual checks).

          Review runtime exceptions in .github/vendor-update-policy.json and docs/vendor-maintenance.md. This workflow does not merge or publish. GitHub may require approval of the additional PR-triggered workflows; the explicit validation above has already run.
          EOF
          number="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPOSITORY" --title "chore(deps): coordinate exact stable vendor pins" --body-file "$RUNNER_TEMP/vendor-update-pr.md"
          else
            gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "chore(deps): coordinate exact stable vendor pins" --body-file "$RUNNER_TEMP/vendor-update-pr.md"
          fi
