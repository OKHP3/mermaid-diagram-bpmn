name: Technology version audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".replit"
      - "package.json"
      - "**/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/check-technology-versions.mjs"
      - "scripts/technology-*.mjs"
      - "docs/technology-*.md"
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Release lookups have a shared four-minute deadline, leaving time for
    # setup, report serialization, and uploading incomplete evidence.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The audit uses Node built-ins and committed manifests/lockfiles. It can
      # report drift even when the application dependency installation is broken.
      - name: Test audit coverage and failure detection
        run: node --test scripts/technology-inventory.test.mjs

      - name: Audit technology versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-technology-versions.mjs --ci --output technology-audit/technology-versions.md --json technology-audit/technology-versions.json

      - name: Preserve the report, including incomplete evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technology-version-audit
          path: technology-audit/
          if-no-files-found: warn
          retention-days: 30
