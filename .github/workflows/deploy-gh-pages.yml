name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run test

      - name: Skill tests
        run: pnpm run skill:test

      - name: Check generated data files are up to date
        run: pnpm run check:generated

      - name: Test check:generated drift detection (exits 1 on injected mismatch)
        run: pnpm run check:generated:test

      - name: Validate skill frontmatter
        run: pnpm run skill:validate

      - name: Test skill:validate failure-mode detection (exits 1 on bad frontmatter)
        run: pnpm run skill:validate:test

      - name: Check Forge brand tokens match profile (no drift)
        run: pnpm run brand:check

      - name: Test brand:check drift detection (exits 1 on injected mismatch)
        run: pnpm run brand:check:test

      - name: Generate skill static files
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run skill:generate

      - name: Build
        run: pnpm --filter @workspace/mermaid-diagram-bpmn run build
        env:
          NODE_ENV: production
          BASE_PATH: /mermaid-diagram-bpmn/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
