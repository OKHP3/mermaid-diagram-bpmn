pir_version: "0.1"
process_id: proc-003
process_name: Quote to Order
process_owner: Sales Operations Manager
department: Sales
elicitation_method: document-analysis
elicitation_date: "2026-05-17"
elicited_by: Business Analyst
status: complete

trigger:
  description: A sales representative identifies a qualified opportunity and needs to generate a formal quote for the customer.
  event_type: manual

actors:
  - role_id: rep
    role_name: Sales Representative
    department: Sales
    type: initiator
    interest: speed — wants to get the quote to the customer quickly to close the deal
    influence: medium
  - role_id: customer
    role_name: Customer
    department: External
    type: approver
    interest: cost control — evaluating price and terms before committing
    influence: high
  - role_id: pricing
    role_name: Pricing Analyst
    department: Finance
    type: reviewer
    interest: compliance — ensures pricing follows approved rate cards and discount policies
    influence: medium
  - role_id: ops
    role_name: Sales Operations Coordinator
    department: Sales
    type: performer
    interest: outcome quality — converts approved quotes into accurate orders
    influence: medium
  - role_id: crm
    role_name: CRM System
    department: IT
    type: system
    interest: outcome quality — stores quote and order records
    influence: low

inputs:
  - id: in-01
    name: Opportunity Record
    source: CRM
    format: system record
  - id: in-02
    name: Product Configuration
    source: Sales Representative
    format: form or product catalogue selection
  - id: in-03
    name: Customer Purchase Order
    source: Customer
    format: document

outputs:
  - id: out-01
    name: Formal Quote Document
    consumer: Customer
    format: PDF
  - id: out-02
    name: Sales Order
    consumer: Order Fulfilment
    format: system record

steps:
  - id: step-01
    description: Create a draft quote in the CRM linked to the qualifying opportunity.
    actor_role_id: rep
    system: CRM
  - id: step-02
    description: Select products, quantities, and apply any negotiated discounts.
    actor_role_id: rep
    system: CRM
  - id: step-03
    description: Submit the quote for pricing review if discounts exceed standard thresholds.
    actor_role_id: rep
    system: CRM
  - id: step-04
    description: Review and approve or adjust the proposed pricing and discount levels.
    actor_role_id: pricing
    system: CRM
  - id: step-05
    description: Generate and send the formal quote document to the customer.
    actor_role_id: rep
    system: CRM
  - id: step-06
    description: Receive and log the customer's acceptance or counter-proposal.
    actor_role_id: ops
    system: CRM
  - id: step-07
    description: Convert the accepted quote to a confirmed sales order in the order management system.
    actor_role_id: ops
    system: Order Management System

exceptions:
  - id: exc-01
    description: Customer requests significant changes after the quote has been sent.
    trigger: Customer responds with a counter-proposal or requests re-pricing.
    handling: Sales Rep revises the quote and resubmits for pricing review if the new discount exceeds thresholds.
  - id: exc-02
    description: Quote expires before customer responds.
    trigger: Quote validity period lapses without a customer decision.
    handling: Sales Rep reactivates the opportunity and issues a new quote, updating pricing if required.
  - id: exc-03
    description: Product is no longer available at the quoted price after quote issuance.
    trigger: Price list update occurs between quote issuance and order conversion.
    handling: Sales Rep notifies customer of the change and re-quotes with a revised price.

business_rules:
  - id: br-01
    description: Discounts greater than 15% require Pricing Analyst approval before the quote can be issued.
    source: policy
  - id: br-02
    description: Quotes are valid for 30 days from the date of issue unless otherwise stated in the quote.
    source: practice
  - id: br-03
    description: A signed customer PO or email acceptance is required before converting a quote to an order.
    source: policy

systems:
  - name: CRM
    role: processor
    integration_type: ui
  - name: Order Management System
    role: destination
    integration_type: api

controls:
  - id: ctrl-01
    type: approval
    description: Quotes with above-threshold discounts are locked until Pricing Analyst approval is recorded.
    enforced_by: CRM
  - id: ctrl-02
    type: validation
    description: Order conversion requires a linked customer acceptance record; system blocks conversion without it.
    enforced_by: Order Management System

open_questions:
  - id: oq-01
    question: Is there a maximum number of revision cycles for a quote before it must be re-evaluated as a new opportunity?
    owner: Sales Operations Manager
  - id: oq-02
    question: Does the order management system automatically notify fulfilment, or is there a manual step?
    owner: Sales Operations Manager

validation:
  completeness_score: null
  ready_for_narrative: null
